<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="350" y="20" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="700">Dust Modeling &amp; Environmental Impacts</text>

  <!-- Driver: saline lake desiccation -->
  <g>
    <rect x="30" y="40" width="220" height="60" rx="10" fill="#eef0eb" stroke="#7a9c6c" stroke-width="1.5"/>
    <text x="140" y="65" text-anchor="middle" font-size="13" fill="#1e1e1e" font-weight="600">Saline Lake</text>
    <text x="140" y="82" text-anchor="middle" font-size="13" fill="#1e1e1e" font-weight="600">Desiccation</text>
  </g>

  <!-- Emission parameterization -->
  <g>
    <rect x="450" y="40" width="220" height="60" rx="10" fill="#e2edf5" stroke="#5b84a8" stroke-width="1.5"/>
    <text x="560" y="65" text-anchor="middle" font-size="13" fill="#1e1e1e" font-weight="600">Emission</text>
    <text x="560" y="82" text-anchor="middle" font-size="13" fill="#1e1e1e" font-weight="600">Parameterization</text>
  </g>

  <path d="M140,100 V140 H240 V158" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <path d="M560,100 V140 H460 V158" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <text x="270" y="132" font-size="11" fill="#4f6b44">exposed lakebed &amp; surface change</text>

  <!-- Center: WRF-Chem simulation -->
  <g>
    <rect x="210" y="160" width="280" height="75" rx="10" fill="#f0e4d6" stroke="#a97142" stroke-width="1.5"/>
    <text x="350" y="188" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">WRF-Chem Dust</text>
    <text x="350" y="206" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">Emission Simulation</text>
    <text x="350" y="224" text-anchor="middle" font-size="11" fill="#7a5230">surface properties + emission scheme</text>
  </g>

  <path d="M280,235 V262 H120 V282" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <path d="M350,235 V282" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
  <path d="M420,235 V262 H580 V282" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>

  <!-- Impact boxes -->
  <g>
    <rect x="10" y="284" width="220" height="70" rx="10" fill="#f5e3e0" stroke="#bd6c5c" stroke-width="1.5"/>
    <text x="120" y="313" text-anchor="middle" font-size="12.5" fill="#1e1e1e" font-weight="600">Air Quality &amp;</text>
    <text x="120" y="330" text-anchor="middle" font-size="12.5" fill="#1e1e1e" font-weight="600">Human Health</text>
  </g>

  <g>
    <rect x="240" y="284" width="220" height="70" rx="10" fill="#eef0eb" stroke="#7a9c6c" stroke-width="1.5"/>
    <text x="350" y="313" text-anchor="middle" font-size="12.5" fill="#1e1e1e" font-weight="600">Community</text>
    <text x="350" y="330" text-anchor="middle" font-size="12.5" fill="#1e1e1e" font-weight="600">Exposure</text>
  </g>

  <g>
    <rect x="470" y="284" width="220" height="70" rx="10" fill="#e2edf5" stroke="#5b84a8" stroke-width="1.5"/>
    <text x="580" y="313" text-anchor="middle" font-size="12.5" fill="#1e1e1e" font-weight="600">Regional Climate</text>
    <text x="580" y="330" text-anchor="middle" font-size="12.5" fill="#1e1e1e" font-weight="600">Feedback</text>
  </g>
</svg>
