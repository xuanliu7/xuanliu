<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Stage 1: Filter samples -->
  <g>
    <rect x="20" y="60" width="150" height="90" rx="10" fill="#f2e8db" stroke="#b98b56" stroke-width="1.5"/>
    <circle cx="95" cy="92" r="14" fill="none" stroke="#b98b56" stroke-width="2"/>
    <line x1="95" y1="78" x2="95" y2="106" stroke="#b98b56" stroke-width="1.2"/>
    <line x1="81" y1="92" x2="109" y2="92" stroke="#b98b56" stroke-width="1.2"/>
    <text x="95" y="132" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">Filter &amp; Field</text>
    <text x="95" y="148" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">Samples</text>
  </g>
  <path d="M170,105 H228" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Stage 2: XRF analysis -->
  <g>
    <rect x="230" y="45" width="180" height="120" rx="10" fill="#e2edf5" stroke="#5b84a8" stroke-width="1.5"/>
    <text x="320" y="75" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">XRF Elemental</text>
    <text x="320" y="92" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">Analysis</text>
    <!-- correction squiggle icon -->
    <path d="M262,118 q14,-16 28,0 q14,16 28,0 q14,-16 28,0" fill="none" stroke="#5b84a8" stroke-width="1.6"/>
    <text x="320" y="146" text-anchor="middle" font-size="11.5" fill="#4a6a85">attenuation bias correction</text>
  </g>
  <path d="M410,105 H468" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Stage 3: Dust mass estimate -->
  <g>
    <rect x="470" y="45" width="200" height="120" rx="10" fill="#f0e4d6" stroke="#a97142" stroke-width="1.5"/>
    <text x="570" y="75" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">Dust Mass &amp;</text>
    <text x="570" y="92" text-anchor="middle" font-size="14" fill="#1e1e1e" font-weight="600">Source Estimate</text>
    <text x="570" y="115" text-anchor="middle" font-size="11.5" fill="#7a5230">regional composition-</text>
    <text x="570" y="130" text-anchor="middle" font-size="11.5" fill="#7a5230">specific mass factors</text>
  </g>

  <!-- QA/QC branch from monitoring network -->
  <g>
    <rect x="130" y="225" width="220" height="55" rx="10" fill="#eef0eb" stroke="#7a9c6c" stroke-width="1.5"/>
    <text x="240" y="248" text-anchor="middle" font-size="13" fill="#1e1e1e" font-weight="600">Global Monitoring Network</text>
    <text x="240" y="264" text-anchor="middle" font-size="11.5" fill="#4f6b44">QA/QC of dust &amp; trace elements</text>
  </g>
  <path d="M240,225 V180 H320 V166" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arrow1)"/>

  <text x="350" y="20" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="700">Dust Measurement &amp; Composition</text>
</svg>
